name: Build iOS 17 App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Use Default Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version

      - name: Run Unit Tests
        run: swift test

      - name: Build Swift Package for iOS
        run: swift build -c release -Xswiftc -sdk -Xswiftc $(xcrun --sdk iphoneos --show-sdk-path) -Xswiftc -target -Xswiftc arm64-apple-ios17.0

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SahamBandarScreener-iOS17-Build
          path: .build/release/

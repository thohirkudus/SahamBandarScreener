name: Build iOS 17 App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package SahamBandarScreener
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode & SDK Info
        run: |
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphoneos

      - name: Build iOS App with xcodebuild
        run: |
          xcodebuild clean build \
            -project SahamBandarScreener.xcodeproj \
            -scheme SahamBandarScreener \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa for iPhone Sideloading
        run: |
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "SahamBandarScreener.app" -type d | head -n 1)
          if [ -d "$APP_PATH" ]; then
            echo "Found compiled app at: $APP_PATH"
            cp -R "$APP_PATH" Payload/
            zip -r SahamBandarScreener-iOS17.ipa Payload
            echo "Successfully generated SahamBandarScreener-iOS17.ipa"
          else
            echo "Warning: .app directory not found in DerivedData"
            zip -r SahamBandarScreener-Sources.zip Sources SahamBandarScreener.xcodeproj
          fi

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SahamBandarScreener-iOS17-Package
          path: |
            *.ipa
            *.zip
          retention-days: 14
